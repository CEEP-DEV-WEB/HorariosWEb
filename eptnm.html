<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Horario - CEEP Áureo Filho</title>
    
    <!-- CSS do Bootstrap 5.3 (Corrigido) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap 1.11.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- css personalizado -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body class="container-fluid m-0 p-0">
    <!-- Menu carregado pelo JavaScript -->
    <div id="menu"></div>

    <section id="pesquisa"
        class="text-center text-dark py-5 my-0 mb-3 rounded-3 shadow overflow-hidden d-flex justify-content-center align-items-center"
        style="background: linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
            url('assets/img/prosub.png') center/cover no-repeat;">

        <div class="container">
            <div class="row justify-content-center">

                <!-- Quase toda largura no celular e menor no desktop -->
                <div class="col-11 col-sm-10 col-md-8 col-lg-6">

                    <label for="campoPesquisa"
                        class="form-label fs-3 fw-semibold">
                        PESQUISE SEU HORÁRIO - MODALIDADE EPTNM
                    </label>

                    <div class="input-group input-group-lg w-100">

                        <input
                            type="search"
                            id="campoPesquisa"
                            class="form-control border-info"
                            placeholder="Digite o que procura...">

                        <button
                            class="btn btn-info px-4"
                            type="button">
                            <i class="bi bi-search"></i>
                        </button>

                    </div>

                </div>
            </div>
        </div>

    </section>

    <main class="container py-4">
        <div id="mensagem" class="alert alert-info">Carregando horários...</div>
        <div id="conteudo"></div>
    </main>

    <div id="areaModais"></div>

    <!-- Menu carregado pelo JavaScript -->
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/scriptdados.js"></script>
    <script src="assets/componentes/menu.js"></script>
    <script src="assets/componentes/footer.js"></script>
</body>
</html>
